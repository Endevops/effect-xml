packages:
  - packages/*

allowBuilds:
  esbuild: true
catalog:
  '@types/node': ^26.6.3
  effect: ^4.0.0
  '@effect/vitest': ^4.0.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  publint: ^0.3.24
  '@arethetypeswrong/core': ^0.18.5
minimumReleaseAgeExclude:
  - effect@4.0.0
  - '@effect/vitest@4.0.0'
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
